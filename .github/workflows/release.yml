name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24', cache: false}
      - run: go test ./... -count=1
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: "release --clean"}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  docker:
    runs-on: ubuntu-latest
    permissions: {packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      # QEMU emulates the arm64 runtime stage (apk add / adduser); the Go build
      # itself cross-compiles on the native amd64 runner. buildx is required for
      # multi-platform output -- the default docker driver cannot produce it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # tag keeps the leading v for the image tag (:v1.3.0); number drops it to
      # match what goreleaser stamps into the binaries ({{.Version}} is the tag
      # without the v), so `gamarr` reports the same string however it was
      # installed.
      - id: version
        run: |
          tag=${GITHUB_REF#refs/tags/}
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "number=${tag#v}" >> $GITHUB_OUTPUT
      # cache-from only, deliberately. This job runs on a tag ref, and the GHA
      # cache scopes a tag as its own branch: a cache written under refs/tags/v1
      # is unreadable from refs/tags/v2 (sibling scopes), so cache-to here would
      # only ever be written, never read. Restoring from the default branch IS
      # allowed, so the entries come from the multi-arch build in test.yml.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          build-args: VERSION=${{ steps.version.outputs.number }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/gamarr:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.name }}/gamarr:latest
