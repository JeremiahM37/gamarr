version: 2
builds:
  - main: ./cmd/gamarr/
    binary: gamarr
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # -X injects the tag so the binary reports its real version. Without it
    # the hardcoded default below ships unchanged, which is why v1.1.0 and
    # v1.2.0 both reported 1.0.0.
    ldflags: [-s, -w, -X, 'main.Version={{.Version}}']
archives:
  - formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
checksum:
  name_template: "checksums.txt"
changelog:
  sort: asc
